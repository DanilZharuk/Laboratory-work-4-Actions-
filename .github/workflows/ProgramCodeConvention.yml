name: C# Code Convention Check

on:
  workflow_dispatch:

jobs:
  csharp_linting:
    name: Перевірка C#-модуля на відповідність нормам
    runs-on: ubuntu-latest

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v3

      - name: Встановлення .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Встановлення dotnet-format
        run: dotnet tool install -g dotnet-format

      - name: Додавання dotnet tools до PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Перевірка стилю коду
        run: dotnet format ProgramCode.csproj --verify-no-changes --verbosity diagnostic
